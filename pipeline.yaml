# Registry of the nodes of the DECam RSI pipeline, as it ran (snapshot, 2026-11-24).
# Paths under implementation are relative to nodes/. hardcoded: counts of occurrences in the node's code, with examples
# (measured by a scan of the copied files). Every node runs only where its site says; nothing here is portable yet.
version: 1
snapshot: 2026-11-24
nodes:
  - id: select-regions
    stage: "1. archive pipeline"
    purpose: "Choose the next ~5 % of DECam's sky to search: 3 x 3 deg cells scored by observing seasons, ecliptic latitude, Rubin coverage of where the bodies have moved, DES share and galactic plane; cells merged into regions of <= 6 cells."
    implementation:
      - "select-regions/archive5/select_regions.py (first 5 %)"
      - "select-regions/ldt5/select_ldt.py (fourth 5 %, LDT-weighted)"
      - "select-regions/conveyor/select_units.py (the conveyor's selector since 2026-11-20)"
      - "select-regions/linker/footprint/*.py (archive inventory: exposures, cones, windows, seasons, costs)"
    run:
      - "python3 -I archive5/select_regions.py"
      - "conveyor/unit.py new UID (copies the selector into units/UID/ and runs it)"
    inputs:
      - {what: "bulk manifests linker/data_real/decam_bulk/{ls6,vista}.tsv", format: "TSV md5, size, name, tag"}
      - {what: "DECam exposure metadata (noirlab_decam_meta) and Rubin visits (rubin_visits)", format: "JSON/TSV, from linker/footprint/fetch_*.py"}
      - {what: "--present: exposures already at NERSC or cached on Vista; --searched: exposures already searched", format: "stem lists"}
    outputs:
      - {file: "regions.json", format: "{asof, rule, frac, margin, cover_deg2, chosen_deg2, n_cells, unique_exposures, unique_tb, regions: [{id, label, ra, dec, deg2, cells, exposures, tb, first_year, last_year, seasons, ...}]}"}
      - {file: "regions_exposures.json", format: "{rid: [exposure stems]}"}
      - {file: "manifests/<rid>.tsv", format: "fetch.py manifest: md5, size, name, tag"}
    config: "--frac (sky share, 0.05), --cover (DECam cover, 31,532 deg2), --margin (deg), --ldt weight|off, --ldt-from/--ldt-to/--ldt-min-h"
    site: "Mac (local metadata only)"
    hardcoded:
      paths: {count: 7, distinct: 2, examples: ["~/anaconda3/bin/python", "/global/cfs/cdirs/cosmo/staging/decam"]}
      hosts: {count: 5, distinct: 1, examples: ["astroarchive.noirlab.edu"]}
      clusters: {count: 45, distinct: 6, examples: ["NERSC", "GB200", "A100", "GH200"]}
    swap: "Another survey: rewrite the inventory (linker/footprint/fetch_*.py against that archive's API) and keep the cell score; another goal (e.g. a follow-up telescope): change the weights in the score function (the LDT weight is the worked example)."
    downstream: ["conveyor"]
  - id: download
    stage: "1. archive pipeline"
    purpose: "Bulk, resumable, md5-checked download of DECam InstCal triplets (image, weight, mask) from the NOIRLab Astro Data Archive, several copies per device sharing one manifest, with a device-wide stream budget and cool-down on throttling."
    implementation:
      - "download/fill/fetch.py"
      - "download/fill/dl_watch.py (monitor and stream controller)"
      - "download/fill/make_blank.py (what is still missing)"
      - "download/fill/mac_fill.sh, nersc_fill.sbatch, vista_fill.sbatch"
      - "download/bulk/*.py, *.sbatch (manifests, first bulk fetch)"
      - "download/conveyor/nersc/unit_fetch.sbatch, download/ldt5/ldt5_fetch.sbatch (per-unit downloads)"
    run:
      - "python3 -I fetch.py MANIFEST.tsv DEST [--part k/N] [--streams 32] [--hours 47] [--max-tb 0]"
      - "python3 -I fill/dl_watch.py loop 10"
    inputs:
      - {what: "manifest", format: "TSV: md5, size, name, tag per line, in download order (bulk/make_manifest.py, fill/make_blank.py)"}
      - {what: "fetch_ctl.json (optional, beside fetch.py)", format: "JSON {total, pause_until, set, note}: device stream budget, written by dl_watch.py"}
    outputs:
      - {file: "DEST/img/<YYMMDD>/<name>.fits.fz", format: "DECam InstCal ooi/oow/ood files"}
      - {file: "DEST/log/done_*.txt, fetch_*.log", format: "names finished (read by the relays); progress lines with MB/s, files, errors"}
      - {file: "dl_watch.json", format: "per-cycle device rates and control events ('ctl')"}
    config: "--streams, --part, --hours, --max-tb; fetch_ctl.json; STOP files (DEST/log/STOP)"
    site: "NERSC xfer jobs, Lonestar6 job, Vista one gg node, the Mac (buffer on an external drive)"
    hardcoded:
      paths: {count: 57, distinct: 46, examples: ["$NERSC_SCRATCH/decam-fill/limits", "$NERSC_SCRATCH/dbt/env/bin/python", "$NERSC_SCRATCH/decam-fill", "$NERSC_SCRATCH/decam-fill/log/job-"]}
      accounts: {count: 79, distinct: 5, examples: ["$NERSC_USER", "$TACC_USER", "$TACC_UID", "$NERSC_CPU_ACCOUNT"]}
      hosts: {count: 10, distinct: 2, examples: ["astroarchive.noirlab.edu", "perlmutter.nersc.gov"]}
      clusters: {count: 52, distinct: 5, examples: ["NERSC", "Vista", "regular", "Lonestar6"]}
      ssh_sockets: {count: 4, distinct: 3, examples: ["$SSH_CM_DIR/nersc-$NERSC_USER.sock", "$SSH_CM_DIR/ls6-$TACC_USER.sock", "$SSH_CM_DIR/vista-$TACC_USER.sock"]}
    swap: "Another archive: replace the URL builder and md5 source in fetch.py (it is standard library only); the manifest format stays. Another cluster: copy fetch.py there and add a job script like nersc_fill.sbatch."
    downstream: ["relay", "detect"]
  - id: relay
    stage: "1. archive pipeline"
    purpose: "Move finished downloads between sites: Mac buffer -> NERSC (rsync over the SSH master), NERSC -> Vista and Lonestar6 -> Vista/NERSC (Globus tasks, checksum-verified, source deleted only after SUCCEEDED)."
    implementation:
      - "relay/fill/relay.py (NERSC -> Vista)"
      - "relay/fill/relay_mac.py (Mac -> NERSC)"
      - "relay/fill/relay_ls6.py, relay_units_ls6.py"
      - "relay/fill/vista_known.py (what is on Vista)"
    run:
      - "python3 -I fill/relay.py loop 30"
      - "python3 -I fill/relay_mac.py loop 2"
    inputs:
      - {what: "each download part's log/done_*.txt", format: "file names finished and md5-checked"}
    outputs:
      - {file: "relay/tasks/<task id>.json", format: "Globus task record (files carried, status)"}
      - {file: "relay/relayed.txt", format: "names now on Vista"}
      - {file: "relay*/relay.log", format: "one line per cycle"}
    config: "loop minutes; STOP files in each relay folder; Globus endpoint ids and paths in the code"
    site: "Mac (drives Globus CLI and rsync)"
    hardcoded:
      paths: {count: 22, distinct: 15, examples: ["$TACC_SCRATCH/decam-fill/img", "$SSH_CM_DIR/ls6-$TACC_USER.sock", "$NERSC_SCRATCH/decam-fill", "$SSH_CM_DIR/nersc-$NERSC_USER.sock"]}
      accounts: {count: 33, distinct: 3, examples: ["$TACC_USER", "$NERSC_USER", "$TACC_UID"]}
      hosts: {count: 4, distinct: 1, examples: ["perlmutter.nersc.gov"]}
      clusters: {count: 74, distinct: 4, examples: ["NERSC", "Vista", "Lonestar6", "LS6"]}
      ssh_sockets: {count: 5, distinct: 3, examples: ["$SSH_CM_DIR/ls6-$TACC_USER.sock", "$SSH_CM_DIR/nersc-$NERSC_USER.sock", "$SSH_CM_DIR/vista-$TACC_USER.sock"]}
    swap: "Another transfer service: replace the globus calls (submit, task status) in relay.py; the queue logic (done -> in flight -> relayed -> delete) stays."
    downstream: ["detect"]
  - id: detect
    stage: "1. archive pipeline"
    purpose: "Single-exposure detection: per CCD, block-median background, Gaussian matched filter at the CCD's FWHM, S/N >= 4.5 peaks with sub-pixel centres and RA/Dec from the CCD's TPV WCS. No stacking; static sources are kept."
    implementation:
      - "detect/archive5/tacc/detect.py"
      - "detect/archive10/nersc/detect_pad.py (weight map 2 px larger than the image)"
      - "detect/conveyor/nersc/unit_detect.sbatch, noweight_detect.py"
      - "detect/archive5/tacc/job*.sbatch, detect/archive10/nersc/*.sbatch"
      - "detect/ldt5/l5_detect*.sbatch, l5_farm.py"
    run:
      - "python3 -I detect.py IMG OUT [--workers 32] [--snr 4.5] [--watch] [--only STEM,...]"
    inputs:
      - {what: "IMG/<YYMMDD>/*_ooi_*, *_oow_*, *_ood_*", format: "DECam InstCal FITS (fpack)"}
    outputs:
      - {file: "OUT/<YYMMDD>/<stem>.npz", format: "columns ra, dec (deg), flux, ferr, snr, x, y, ccd, sharp, flag (1 near saturation, 2 masked, 4 edge); exposure values stem, expnum, mjd_mid, band, exptime, magzero, fwhm, airmass, ra0, dec0, wcscal"}
    config: "--snr, --workers; mask handling (CP mask value 7 marks moving bodies: dropped as it ran)"
    site: "NERSC CPU nodes (account $NERSC_CPU_ACCOUNT; GPU kept for the search), earlier TACC Vista/Lonestar6"
    hardcoded:
      paths: {count: 30, distinct: 6, examples: ["$NERSC_SCRATCH/archive10", "$NERSC_SCRATCH/dbt/env/bin/python", "$NERSC_SCRATCH/ldt5", "$NERSC_SCRATCH/units/slurm/detect-"]}
      accounts: {count: 53, distinct: 5, examples: ["$NERSC_USER", "$NERSC_CPU_ACCOUNT", "$NERSC_GPU_ACCOUNT", "$TACC_USER"]}
      hosts: {count: 5, distinct: 3, examples: ["astroarchive.noirlab.edu", "ls6.tacc.utexas.edu", "vista.tacc.utexas.edu"]}
      clusters: {count: 32, distinct: 5, examples: ["NERSC", "regular", "debug", "A100"]}
    swap: "Another detector (e.g. SExtractor or a CNN): any program that writes the same .npz columns per exposure plugs in; unit-build reads only those columns."
    downstream: ["unit-build"]
  - id: unit-build
    stage: "1. archive pipeline"
    purpose: "Turn one region's detection lists into a scenario (what a search program reads) and its labels (known bodies placed by JPL Horizons in every exposure, detections within 2\" labelled)."
    implementation:
      - "unit-build/decam-big-tno/bin/build_scen.py (+ build.sbatch, fix_pointing.py)"
      - "unit-build/archive5/link/known_pos.py, unit-build/ldt5/known_pos.py"
      - "unit-build/conveyor/nersc/unit_build.sbatch, unit_farm.py"
      - "unit-build/decam-big-tno/harness/searchunit/{split_region,thin_region}.py"
      - "unit-build/decam-big-tno/harness/{open_data,relabel_faint,body_props,body_props_par}.py (the r2 agents' open, labelled regions)"
    run:
      - "python3 -I known_pos.py REG_A,REG_B [--hmax 8]"
      - "PAIRS=RID:SID,... sbatch build.sbatch (runs build_scen.py next to the data)"
    inputs:
      - {what: "detection lists", format: "detect's .npz per exposure"}
      - {what: "known/<rid>.json", format: "{rid, bodies: [{name, pdes, H, first_obs, pos: {stem: [ra, dec]}}]}"}
      - {what: "regions_exposures.json", format: "{rid: [stems]}"}
    outputs:
      - {file: "SCEN/<sid>/det_*.npy", format: "det_ra, det_dec (float64 deg), det_flux, det_ferr, det_snr, det_sharp, det_x, det_y (float32), det_ccd (int16), det_flag (uint8), det_exp (int32 row of the exposure table)"}
      - {file: "SCEN/<sid>/exposures.json", format: "[{stem, mjd_mid, band, exptime, magzero, fwhm, airmass, ra0, dec0, obs_xyz}]"}
      - {file: "SCEN/<sid>/region.json", format: "{centre, radius, seasons}"}
      - {file: "TRUTH/<sid>.npz (sealed, never shipped)", format: "det_body, known table (name, H, weight), nights per body"}
    config: "sid = 's' + sha1(rid)[:8]; --hmax 8; --planted N (0 as it ran)"
    site: "NERSC CPU (build jobs, or a held interactive CPU node), earlier Vista gg; known positions on the Mac (JPL Horizons)"
    hardcoded:
      paths: {count: 28, distinct: 15, examples: ["$SSH_CM_DIR/nersc-$NERSC_USER.sock", "$NERSC_SCRATCH/dbt/scen", "$TACC_SCRATCH/decam-fill/img", "$TACC_WORK/vista/archive5/env/bin/python"]}
      accounts: {count: 48, distinct: 5, examples: ["$TACC_UID", "$TACC_USER", "$NERSC_USER", "$VISTA_ACCOUNT"]}
      hosts: {count: 8, distinct: 4, examples: ["perlmutter.nersc.gov", "ssd.jpl.nasa.gov", "astroarchive.noirlab.edu", "$VM_HOST"]}
      clusters: {count: 40, distinct: 5, examples: ["NERSC", "Vista", "A100", "debug"]}
      ssh_sockets: {count: 4, distinct: 1, examples: ["$SSH_CM_DIR/nersc-$NERSC_USER.sock"]}
    swap: "Another truth source (e.g. a different known-object catalogue): replace known_pos.py's SBDB + Horizons calls, keep its JSON; another detection format: adapt the reader in build_scen.py."
    downstream: ["search-worker"]
  - id: conveyor
    stage: "1. archive pipeline"
    purpose: "The Mac coordinator of continuous discovery: unit after unit (5 % of the sky each), select -> stage -> download -> detect -> build -> one search task per region, mirrored between NERSC and Vista, always with the hill climb's current best program; keeps worker jobs queued; retries failed regions."
    implementation:
      - "conveyor/conveyor/conveyor.py (the loop)"
      - "conveyor/conveyor/units_side.py (per-unit stages, reloaded every tick)"
      - "conveyor/conveyor/unit.py (new / known / stage a unit)"
      - "conveyor/conveyor/{watchdog,site_scan}.py"
      - "conveyor/conveyor/nersc/*.py"
      - "conveyor/PIPELINE.md (the live map as it ran)"
    run:
      - "nohup python3 -I conveyor.py loop 3 >> loop.stdout 2>&1 &"
    inputs:
      - {what: "rsi/decam-big-tno/runs/r2/state.json", format: "the climb's best generation and its submission path"}
      - {what: "units/<uid>/regions_search.json", format: "[{rid, sid, n_exp, ldt_h}]"}
      - {what: "site scans", format: "claims, out/, timing/, worker files at each site"}
    outputs:
      - {file: "state.json", format: "per unit: stage, regions, tasks, claims"}
      - {file: "ROOT/queue/<prio>_<unit>_<sid>", format: "one line: unit sid budget_s class"}
      - {file: "ROOT/best/<gen>/sub, ROOT/best/CURRENT", format: "the program workers copy"}
      - {file: "conveyor.log, alerts.log, health.json", format: "text / JSON"}
    config: "KINDS (worker kinds and caps per site), budgets 1,800 s (7,200 s over 1,000 exposures), STOP file"
    site: "Mac, driving NERSC and Vista over SSH masters and Globus"
    hardcoded:
      paths: {count: 34, distinct: 22, examples: ["$SSH_CM_DIR/nersc-$NERSC_USER.sock", "$NERSC_SCRATCH/dbt/env/bin/python", "$NERSC_SCRATCH/decam-fill", "$NERSC_SCRATCH/units"]}
      accounts: {count: 65, distinct: 5, examples: ["$NERSC_USER", "$TACC_USER", "$TACC_UID", "$NERSC_CPU_ACCOUNT"]}
      hosts: {count: 15, distinct: 2, examples: ["perlmutter.nersc.gov", "vista.tacc.utexas.edu"]}
      clusters: {count: 119, distinct: 8, examples: ["NERSC", "Vista", "debug", "regular"]}
      ssh_sockets: {count: 10, distinct: 3, examples: ["$SSH_CM_DIR/nersc-$NERSC_USER.sock", "$SSH_CM_DIR/vista-$TACC_USER.sock", "$SSH_CM_DIR/ls6-$TACC_USER.sock"]}
    swap: "Another cluster: add a site entry (host, socket, user, scratch root, Python, worker sbatch) in conveyor.py's SITES and a worker job script; another program source: change where 'best' is read (one function)."
    downstream: ["download", "search-worker"]
  - id: search-worker
    stage: "1. archive pipeline"
    purpose: "Run the search program on one region per GPU: claim a task, copy the current best program, run it without network (unshare -rn where allowed) within its budget, write candidates and timings."
    implementation:
      - "search-worker/conveyor/worker.sh, nersc_worker.sbatch, vista_worker.sbatch"
      - "search-worker/decam-big-tno/harness/search*/ (the campaigns before the conveyor: search38, search10a/b, searchldt5, searcha15)"
    run:
      - "bash worker.sh ROOT SCEN PY SITE LANES BIGOK WALL_S [IDLE_S] (inside an allocation)"
    inputs:
      - {what: "ROOT/queue/*", format: "unit sid budget_s class"}
      - {what: "SCEN/<sid>/", format: "unit-build's scenario"}
      - {what: "ROOT/best/CURRENT", format: "program folder"}
    outputs:
      - {file: "ROOT/out/<unit>/<sid>/candidates.json", format: "[{det: [row ids], p}] (the program's output; top 2,000 read)"}
      - {file: "ROOT/timing/<unit>/<sid>", format: "'seconds rc gen site device isolation'"}
      - {file: "ROOT/log/<unit>/<sid>.log", format: "program stdout/stderr"}
    config: "lanes per node, big-region permission (host memory), wall, idle time"
    site: "NERSC gpu_shared / interactive A100 nodes; Vista gh-dev, gh (GH200), gb (GB200)"
    hardcoded:
      paths: {count: 35, distinct: 16, examples: ["$NERSC_SCRATCH/dbt", "~/anaconda3/bin/python", "$NERSC_SCRATCH/archive10", "$NERSC_SCRATCH/archive5"]}
      accounts: {count: 46, distinct: 6, examples: ["$NERSC_USER", "$NERSC_CPU_ACCOUNT", "$NERSC_GPU_ACCOUNT", "$TACC_UID"]}
      clusters: {count: 88, distinct: 9, examples: ["NERSC", "regular", "A100", "Vista"]}
    swap: "Another program: anything that runs as finder.py --scen DIR --out DIR --budget-s S and writes candidates.json; another cluster: a new sbatch that calls worker.sh with its Python and scratch paths."
    downstream: ["grade"]
  - id: grade
    stage: "2. scoring"
    purpose: "Score programs (climb rounds) and searched units: global ranking by p over all regions, K = 2 x findable known bodies scored; found = >= 80 % of a candidate's detections on one body and >= 5 of its nights; weight 2 for H <= 7, 1 for 7 < H <= 8. Also per-body feedback for the agents and the leads (confident unlabelled candidates)."
    implementation:
      - "grade/decam-big-tno/harness/grade.py"
      - "grade/decam-big-tno/harness/oracle.py (perfect 1.0, low-p junk 1.0, high-p junk 0.0)"
      - "grade/decam-big-tno/harness/nersc_grade.py + nersc/grade_node.sh (one interactive 4 x A100 node)"
      - "grade/decam-big-tno/harness/vista/run_gb.sbatch (GB200, before 2026-11-13)"
      - "grade/decam-big-tno/harness/gpu_logs.py"
      - "grade/decam-big-tno/harness/searchunit/scoreunit.py (score a conveyor unit, send its leads)"
    run:
      - "python3 -I harness/scoreunit.py score|leads UNIT"
      - "python3 -I harness/nersc_grade.py JOB TAG=SUBDIR=GRADEDIR [...] [--budget 3600]"
    inputs:
      - {what: "OUT/<sid>/candidates.json", format: "[{det, p}]"}
      - {what: "timing", format: "seconds per region"}
      - {what: "private/truth*/<sid>.npz", format: "labels (sealed)"}
    outputs:
      - {file: "GRADE/public.json", format: "{reward, gpu_hours, status, seconds}"}
      - {file: "GRADE/grade.json (private)", format: "{reward, R_known, weights, gpu_hours, slots, candidates, cut_p, per_scenario, feedback, found, leads}"}
      - {file: "GRADE/bodies.md (private)", format: "per findable body: found / below_cut / few_nights / mixed / in no candidate"}
    config: "PER_SCEN 2,000; K = 2 x findable; found threshold 80 % and 5 nights; weights by H"
    site: "programs run on NERSC (A100) or Vista (GB200); scoring on the Mac (numpy)"
    hardcoded:
      paths: {count: 9, distinct: 6, examples: ["$SSH_CM_DIR/nersc-$NERSC_USER.sock", "~/anaconda3/bin/python", "$NERSC_SCRATCH/dbt", "$TACC_SCRATCH/dbt/jobs/grade-"]}
      accounts: {count: 16, distinct: 5, examples: ["$NERSC_USER", "$TACC_UID", "$TACC_USER", "$NERSC_GPU_ACCOUNT"]}
      hosts: {count: 1, distinct: 1, examples: ["perlmutter.nersc.gov"]}
      clusters: {count: 21, distinct: 7, examples: ["A100", "NERSC", "Vista", "interactive"]}
      ssh_sockets: {count: 2, distinct: 1, examples: ["$SSH_CM_DIR/nersc-$NERSC_USER.sock"]}
    swap: "Another grader: keep candidates.json and public.json; change the match rule or weights in grade.py; the climb reads only public.json plus the feedback fields it shows the agents."
    downstream: ["climb", "lead-check"]
  - id: rsi-loop
    stage: "3. program writing (task 1)"
    purpose: "Task 1 (planet-search): the first RSI loop. Each generation is one agent session that cannot score anything; it gets every earlier program, its notes and scalar reward, writes a finder for raw DECam images of one patch over days to weeks, and is graded on 10 sealed fields (A100, 900 s each). Its best program (r2 gen015) is the reference solver."
    implementation:
      - "rsi-loop/planet-search/rsi/harness/rsi_loop.py (outer loop, agent sandbox)"
      - "rsi-loop/planet-search/rsi/harness/grade.py (sandboxed grader)"
      - "rsi-loop/planet-search/rsi/harness/task/ (instruction, starter, reference linker, tools/check.py, graders.json)"
      - "rsi-loop/planet-search/rsi/harness/ls6/ (Lonestar6 and NERSC graders, race.py)"
      - "rsi-loop/planet-search/rsi/harness/programs_git.py, campaign_sync.py, gcp_agent.py"
      - "rsi-loop/planet-search/rsi/bin/ (scenario selection, fetch, truth)"
      - "rsi-loop/planet-search/rsi/baselines/kbmod/ (KBMOD baseline: 0.015)"
      - "rsi-loop/planet-search/rsi/REFERENCE_SOLVER.md"
    run:
      - "python3 -I rsi_loop.py gen RUN [--n 1] [--model claude-opus-5-5] [--effort xhigh] [--hours 3]"
    inputs:
      - {what: "scenario folder", format: "exposures.csv (exp_id, image, weight, mask, mjd_mid, band, magzero, seeing, obs_x/y/z, ...), exposures/*.fits.fz, meta.json"}
      - {what: "history/", format: "every earlier program, NOTES.md, reward.json (reward, per_scenario seconds)"}
    outputs:
      - {file: "OUT.json (program)", format: "{candidates: [{epoch_mjd, state [x,y,z,vx,vy,vz], p, mag}]} (<= 200 per scenario)"}
      - {file: "runs/<run>/gens/<gen>/reward.json", format: "{reward, status, finder_seconds_total, graded_on, budget_s}"}
      - {file: "programs.git", format: "one commit per generation; tags genNNN, record-<reward>-genNNN"}
    config: "runs/<run>/config.json: eval (sealed sids), k_per_scen, cap_s, start, last_gen, agent_on (mac | gcp)"
    site: "agents on the Mac (sandbox-exec) or the GCP VM; grading on NERSC A100 (also Lonestar6, Mac early on)"
    hardcoded:
      paths: {count: 23, distinct: 10, examples: ["~/anaconda3/bin/python", "$SSH_CM_DIR/ls6-$TACC_USER.sock", "$SSH_CM_DIR/nersc-$NERSC_USER.sock", "$NERSC_SCRATCH/rsi-planet"]}
      accounts: {count: 14, distinct: 5, examples: ["$TACC_USER", "$NERSC_USER", "$TACC_UID", "$LS6_ACCOUNT"]}
      hosts: {count: 9, distinct: 8, examples: ["$VM_HOST", "ssd.jpl.nasa.gov", "astroarchive.noirlab.edu", "$VM_HOST"]}
      clusters: {count: 110, distinct: 8, examples: ["A100", "LS6", "Lonestar6", "NERSC"]}
      ssh_sockets: {count: 4, distinct: 2, examples: ["$SSH_CM_DIR/ls6-$TACC_USER.sock", "$SSH_CM_DIR/nersc-$NERSC_USER.sock"]}
      models: {count: 5, distinct: 2, examples: ["Opus 5.5", "claude-opus-5-5"]}
    swap: "Another model: --agent/--model/--effort; another sandbox: sandbox_profile() (macOS) or gcp_agent.py (container); another grader site: graders.json + ls6/*.py."
    downstream: ["climb", "novelty"]
  - id: climb
    stage: "3. program writing (task 2)"
    purpose: "Task 2 (decam-big-tno): the hill climb whose best program runs the archive search. Each round one or two agents (Claude Fable 5.2 via Claude Code; GPT 6 / 6.2 Astra via Codex) get every earlier program with its rewards, per-body feedback and run logs, write finder.py in a Harbor trial (CPU only, 2 h, no web), and the program is graded on 4 regions (one A100 each, 1,800 s). Rewards: recall and GPU-hours, never mixed."
    implementation:
